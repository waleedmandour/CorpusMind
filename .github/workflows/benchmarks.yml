# CorpusMind benchmark battery (manuscript-facing).
#
# Runs the three benchmark pieces that can execute deterministically on CI
# runners and produces reviewer-verifiable artifacts:
#
#   1. perf-arabic  — scripts/benchmark_arabic_corpus.py: the REAL production
#      path (CAMeL calima-msa-r13 morphology + DIDModel6 dialect ID) at
#      corpus scale, with repetitions, spread, and a full provenance block.
#   2. seg-araseg   — engine/eval/segmentation_araseg.py (intrinsic boundary
#      P/R/F1 vs the AraSEG shared-task dev splits) and
#      engine/eval/segmentation_downstream.py (extrinsic deltas through the
#      real engine). Data is fetched from Hugging Face and verified against
#      the pinned checksums in benchmarks/data/araseg_sha256.txt — never
#      vendored, never silently updated.
#   3. grounding    — OPTIONAL (workflow_dispatch only, needs provider
#      secrets): the assistant-in-the-loop grounding fidelity run
#      (eval.run_grounding + eval.score). CI without a real LLM provider can
#      only exercise the harness mechanics (already covered offline by
#      tests/test_eval_grounding.py), so the paper's grounding numbers must
#      come from a dispatched run with secrets configured.
#
# Results handling (academic practice):
#   - every run uploads machine-readable JSON artifacts + a markdown summary;
#   - a dispatched run with commit_results=true additionally commits the
#     artifacts under benchmarks/results/<run-id>/ together with a manifest
#     (run URL, commit, UTC time, artifact sha256s) so the manuscript can cite
#     an immutable, auditable snapshot.
#
# Note on runner noise: CI runners are standardized (ubuntu-latest) but shared
# infrastructure; throughput numbers carry run-to-run variance, which is why
# the battery reports repetitions and CV% instead of single measurements.

name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      bench_sizes:
        description: "Token counts for the Arabic pipeline benchmark (comma-separated)"
        default: "20000,100000,250000"
        required: false
      bench_reps:
        description: "Timed repetitions per size"
        default: "3"
        required: false
      seg_limit:
        description: "Documents per condition for the downstream-delta eval"
        default: "5"
        required: false
      run_grounding:
        description: "Run grounding fidelity (needs CORPUSMIND_CLOUD_* secrets)"
        type: boolean
        default: false
      grounding_provider:
        description: "Provider registry name passed to eval.run_grounding (ollama | cloud | lmstudio)"
        default: "cloud"
        required: false
      cloud_vendor:
        description: "Cloud VENDOR for CORPUSMIND_CLOUD_PROVIDER (anthropic | openai | gemini | custom | none) — distinct from the registry name above"
        default: "gemini"
        required: false
      grounding_model:
        description: "Model id for the provider"
        default: ""
        required: false
      grounding_pause:
        description: "Seconds to sleep before each question (rate-limit pacing; 7.0 fits free-tier Gemini ~10 RPM)"
        default: "7"
        required: false
      grounding_only:
        description: "Space/comma-separated question ids to run (empty = full 80-question bank)"
        default: ""
        required: false
      grounding_timeout:
        description: "Per-question HTTP timeout seconds for the harness (600 fits cloud reasoning models)"
        default: "600"
        required: false
      grounding_chat_deadline_s:
        description: "Engine chat-turn deadline seconds (CORPUSMIND_CHAT_TIMEOUT_S; 300 fits cloud reasoning models)"
        default: "300"
        required: false
      reasoning_effort:
        description: "Opt-in reasoning_effort for cloud chats (low fits Gemini 3.x; empty = field not sent; inert for ollama)"
        default: "low"
        required: false
      run_gold_diff:
        description: "Run the full gold diff (rebuild all 80 golds vs frozen — also runs automatically on PRs touching eval/splitter paths)"
        type: boolean
        default: false
        required: false
      debug_raw:
        description: "Include raw provider bodies in error diagnostics (CORPUSMIND_DEBUG_RAW=1)"
        type: boolean
        default: false
        required: false
      commit_results:
        description: "Commit artifacts to benchmarks/results/ (data-only commit)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "benchmarks/**"
      - "scripts/benchmark_arabic_corpus.py"
      - ".github/workflows/benchmarks.yml"
      - "engine/eval/**"
      - "engine/nlp/arabic/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------
  # 1. Arabic production-path throughput at corpus scale
  # -----------------------------------------------------------------------
  perf-arabic:
    name: Perf (Arabic pipeline)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Install engine + CAMeL Tools
        run: |
          python -m pip install --upgrade pip
          pip install -e "./engine[dev]" python-multipart cryptography
          pip install camel-tools docopt pyrsistent muddler emoji

      - name: Cache CAMeL Tools data
        uses: actions/cache@v4
        with:
          path: ~/.camel_tools
          key: ${{ runner.os }}-camel-tools-data-${{ hashFiles('engine/pyproject.toml') }}

      - name: Download CAMeL morphology + dialect data
        run: |
          camel_data -i morphology-db-msa-r13
          camel_data -i dialectid-model6

      - name: Run benchmark
        run: |
          python scripts/benchmark_arabic_corpus.py \
            --sizes "${{ inputs.bench_sizes || '20000,100000' }}" \
            --reps "${{ inputs.bench_reps || '3' }}" \
            --label "ci-${{ github.event_name }}" \
            --out benchmarks/out/perf_arabic.json

      - name: Markdown summary
        run: python benchmarks/scripts/summary_md.py benchmarks/out >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: perf-arabic
          path: benchmarks/out/
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # 2. Arabic sentence segmentation vs AraSEG (intrinsic + extrinsic)
  # -----------------------------------------------------------------------
  seg-araseg:
    name: Segmentation (AraSEG)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Install engine + CAMeL Tools + pyarrow
        run: |
          python -m pip install --upgrade pip
          pip install -e "./engine[dev]" python-multipart cryptography pyarrow
          pip install camel-tools docopt pyrsistent muddler emoji

      - name: Cache CAMeL Tools data
        uses: actions/cache@v4
        with:
          path: ~/.camel_tools
          key: ${{ runner.os }}-camel-tools-data-${{ hashFiles('engine/pyproject.toml') }}

      - name: Download CAMeL morphology + dialect data
        run: |
          camel_data -i morphology-db-msa-r13
          camel_data -i dialectid-model6

      - name: Fetch AraSEG dev splits (checksum-pinned)
        run: bash benchmarks/scripts/fetch_araseg.sh /tmp/araseg

      - name: Convert parquet -> JSONL (with provenance side-car)
        run: |
          python benchmarks/scripts/araseg_parquet_to_jsonl.py \
            --parquet /tmp/araseg/PA_dev.parquet --out /tmp/araseg/PA/dev.jsonl \
            --source "https://huggingface.co/datasets/MBZUAI/AraSeg-2026-Shared-Task-PA (dev split, checksum-pinned)"
          python benchmarks/scripts/araseg_parquet_to_jsonl.py \
            --parquet /tmp/araseg/NP_dev.parquet --out /tmp/araseg/NP/dev.jsonl \
            --source "https://huggingface.co/datasets/MBZUAI/AraSeg-2026-Shared-Task-NP (dev split, checksum-pinned)"

      - name: Intrinsic evaluation (PA + NP, full dev)
        working-directory: engine
        run: |
          mkdir -p ../benchmarks/out
          python -m eval.segmentation_araseg --data /tmp/araseg/PA/dev.jsonl \
            --task PA --out ../benchmarks/out/seg_intrinsic_PA.json
          python -m eval.segmentation_araseg --data /tmp/araseg/NP/dev.jsonl \
            --task NP --out ../benchmarks/out/seg_intrinsic_NP.json

      - name: Extrinsic downstream deltas (PA + NP, limited)
        working-directory: engine
        run: |
          python -m eval.segmentation_downstream --data /tmp/araseg/PA/dev.jsonl \
            --limit "${{ inputs.seg_limit || '5' }}" --out ../benchmarks/out/seg_downstream_PA.json
          python -m eval.segmentation_downstream --data /tmp/araseg/NP/dev.jsonl \
            --limit "${{ inputs.seg_limit || '5' }}" --out ../benchmarks/out/seg_downstream_NP.json

      - name: Copy data provenance side-cars
        run: |
          mkdir -p benchmarks/out
          cp /tmp/araseg/PA/dev.jsonl.meta.json benchmarks/out/PA_dev.meta.json || true
          cp /tmp/araseg/NP/dev.jsonl.meta.json benchmarks/out/NP_dev.meta.json || true
          cp /tmp/araseg/araseg_sha256.txt benchmarks/out/araseg_sha256.txt || true

      - name: Markdown summary
        run: python benchmarks/scripts/summary_md.py benchmarks/out >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: seg-araseg
          path: benchmarks/out/
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # 3. Full gold diff — rebuild ALL grounding golds vs the frozen file
  # -----------------------------------------------------------------------
  # "Frozen gold unaffected" is only ever established by rebuilding the
  # whole bank: the old live test covered G-001 + G-003 only, both English,
  # neither sentence-scoped. The Arabic sentence-scoped questions (G-044,
  # G-056, G-074, possibly G-002) recompute sentence counts, so splitter
  # changes can shift their frozen values silently. This job is the gate
  # every grounding re-run (and every splitter change) must pass. A
  # non-empty diff is a REVIEWED event: re-freeze the gold in a reviewed PR
  # (report attached) or fix the rebuild — never the gold.
  gold-diff:
    name: Gold diff (rebuild all vs frozen)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    if: (github.event_name == 'workflow_dispatch' && inputs.run_gold_diff) || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Install engine + CAMeL Tools
        run: |
          python -m pip install --upgrade pip
          pip install -e "./engine[dev]" python-multipart cryptography
          pip install camel-tools docopt pyrsistent muddler emoji

      - name: Cache CAMeL Tools data
        uses: actions/cache@v4
        with:
          path: ~/.camel_tools
          key: ${{ runner.os }}-camel-tools-data-${{ hashFiles('engine/pyproject.toml') }}

      - name: Download CAMeL morphology + dialect data
        run: |
          camel_data -i morphology-db-msa-r13
          camel_data -i dialectid-model6

      - name: Install pinned spaCy model (must match the frozen gold _meta = 3.8.0)
        # The gold's English token counts were produced WITH this model; a
        # different/absent model changes ingest tokenization and would show
        # up as false gold diffs.
        run: pip install "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"

      - name: Rebuild all 80 golds and diff vs frozen
        working-directory: engine
        run: |
          mkdir -p ../benchmarks/out
          python -m eval.gold_diff --out ../benchmarks/out/gold_diff.json

      - name: Upload gold-diff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-diff
          path: benchmarks/out/gold_diff.json
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # 4. Assistant grounding fidelity (OPTIONAL — needs a real provider)
  # -----------------------------------------------------------------------
  grounding:
    name: Grounding fidelity (provider-in-the-loop)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    if: github.event_name == 'workflow_dispatch' && inputs.run_grounding
    env:
      CORPUSMIND_CLOUD_PROVIDER: ${{ inputs.cloud_vendor || 'gemini' }}
      CORPUSMIND_CLOUD_API_KEY: ${{ secrets.CORPUSMIND_CLOUD_API_KEY }}
      CORPUSMIND_CLOUD_DEFAULT_MODEL: ${{ inputs.grounding_model }}
      CORPUSMIND_CLOUD_BASE_URL: ${{ secrets.CORPUSMIND_CLOUD_BASE_URL }}
      # post-v2.0.1: the cloud-turn settings, recorded in every run manifest.
      # Gemini 3.x cannot turn thinking off — reasoning_effort=low keeps a
      # grounded tool round inside the chat deadline; the deadline itself is
      # raised from 180s (G-040 died at exactly 180s on pass 1).
      CORPUSMIND_CHAT_TIMEOUT_S: ${{ inputs.grounding_chat_deadline_s || '300' }}
      CORPUSMIND_CLOUD_REASONING_EFFORT: ${{ inputs.reasoning_effort || 'low' }}
      CORPUSMIND_CLOUD_CHAT_TIMEOUT_S: "240"
      # Diagnostics (opt-in via the debug_raw input): a provider-integration
      # bug (8x "unexpected response shape" in run 40953800717) is
      # undiagnosable from logs while the engine withholds raw bodies. Raw
      # bodies can embed corpus-derived model output, so they stay OFF by
      # default and are enabled per-run when triaging a provider issue.
      CORPUSMIND_DEBUG_RAW: ${{ inputs.debug_raw && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard — does the selected provider have what it needs?
        id: guard
        run: |
          PROVIDER="${{ inputs.grounding_provider || 'cloud' }}"
          if [ "$PROVIDER" = "ollama" ]; then
            # Local-first primary row: no provider key, no quota.
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "::notice::grounding run on LOCAL ollama (${{ inputs.grounding_model || 'qwen2.5:1.5b' }}) — no provider key needed"
          elif [ -z "${{ secrets.CORPUSMIND_CLOUD_API_KEY }}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::grounding run skipped — set repo secrets CORPUSMIND_CLOUD_API_KEY (and optionally CORPUSMIND_CLOUD_BASE_URL), then dispatch again with run_grounding=true"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Ollama (local provider row only)
        if: steps.guard.outputs.available == 'true' && (inputs.grounding_provider || 'cloud') == 'ollama'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start Ollama server (local provider row only)
        if: steps.guard.outputs.available == 'true' && (inputs.grounding_provider || 'cloud') == 'ollama'
        run: |
          if ! curl -sf http://127.0.0.1:11434/api/tags > /dev/null; then
            nohup ollama serve > /tmp/ollama.log 2>&1 &
            for i in $(seq 1 60); do
              curl -sf http://127.0.0.1:11434/api/tags > /dev/null && break
              sleep 2
            done
          fi
          curl -sf http://127.0.0.1:11434/api/tags > /dev/null \
            || { cat /tmp/ollama.log; exit 1; }

      - name: Pull the local model (local provider row only)
        if: steps.guard.outputs.available == 'true' && (inputs.grounding_provider || 'cloud') == 'ollama'
        run: |
          MODEL="${{ inputs.grounding_model || 'qwen2.5:1.5b' }}"
          ollama pull "$MODEL"
          ollama ls

      - name: Set up Python 3.12
        if: steps.guard.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Install engine + CAMeL Tools
        if: steps.guard.outputs.available == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e "./engine[dev]" python-multipart cryptography
          pip install camel-tools docopt pyrsistent muddler emoji

      - name: Cache CAMeL Tools data
        if: steps.guard.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.camel_tools
          key: ${{ runner.os }}-camel-tools-data-${{ hashFiles('engine/pyproject.toml') }}

      - name: Download CAMeL morphology + dialect data
        if: steps.guard.outputs.available == 'true'
        run: |
          camel_data -i morphology-db-msa-r13
          camel_data -i dialectid-model6

      - name: Install pinned spaCy model (must match grounding gold _meta = 3.8.0)
        if: steps.guard.outputs.available == 'true'
        # NOT `python -m spacy download` — that installs the latest build and
        # would drift from the frozen gold's recorded model version (the gold
        # determinism test fails on exactly this drift).
        run: pip install "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"

      - name: Run the grounding question bank
        if: steps.guard.outputs.available == 'true'
        working-directory: engine
        run: |
          mkdir -p eval/runs
          ONLY_ARGS=""
          if [ -n "${{ inputs.grounding_only }}" ]; then
            # comma- or whitespace-separated ids -> --only expects separate args
            ONLY_ARGS="--only $(echo '${{ inputs.grounding_only }}' | tr ',' ' ')"
          fi
          python -m eval.run_grounding \
            --provider "${{ inputs.grounding_provider || 'cloud' }}" \
            ${{ inputs.grounding_model && format('--model {0}', inputs.grounding_model) || '' }} \
            --pause "${{ inputs.grounding_pause || '7' }}" \
            --rate-retries 4 \
            --timeout "${{ inputs.grounding_timeout || '600' }}" \
            $ONLY_ARGS \
            --out eval/runs/paper_run.json

      - name: Score the run
        if: steps.guard.outputs.available == 'true'
        working-directory: engine
        run: python -m eval.score eval/runs/paper_run.json --out eval/runs/paper_report.json --verbose

      - name: Upload report
        if: steps.guard.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: grounding-report
          path: engine/eval/runs/
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # 5. Results snapshot (OPTIONAL — data-only commit for the manuscript)
  # -----------------------------------------------------------------------
  results-snapshot:
    name: Commit results snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [perf-arabic, seg-araseg]
    if: github.event_name == 'workflow_dispatch' && inputs.commit_results
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: benchmarks/results/run-${{ github.run_id }}

      - name: Write snapshot manifest
        run: |
          python benchmarks/scripts/make_manifest.py "benchmarks/results/run-${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit "${{ github.sha }}"

      - name: Push snapshot branch (main is protected — direct pushes are declined)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="bench/snapshot-run-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add benchmarks/results
          git commit -m "bench: results snapshot from run ${{ github.run_id }} (tested commit ${{ github.sha }})"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_ENV"

      - name: Open snapshot PR
        env:
          SNAPSHOT_BRANCH: bench/snapshot-run-${{ github.run_id }}
        run: |
          BODY="Automated results snapshot from run ${{ github.run_id }} (tested commit ${{ github.sha }}). Data-only commit: artifacts + sha256 manifest under benchmarks/results/. Merge to make the citable snapshot visible on main."
          jq -n --arg t "bench: results snapshot run ${{ github.run_id }}" \
                --arg h "$SNAPSHOT_BRANCH" --arg b "$BODY" \
                '{title:$t, head:$h, base:"main", body:$b}' > /tmp/pr.json
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls" \
            -d @/tmp/pr.json > /dev/null \
            || echo "::notice::snapshot PR not created (may already exist)"
