name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------
  # Engine: Python tests + lint
  # -----------------------------------------------------------------------
  engine:
    name: Engine (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Install engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install python-multipart cryptography
          # camel_tools is declared in pyproject.toml but is optional in
          # practice — its morphology databases are a separate ~170 MB
          # download that doesn't ship with the wheel. We install it
          # explicitly here (plus its runtime deps that aren't auto-pulled)
          # so the 9 tests in test_phase3_arabic.py that actually exercise
          # Arabic morphology can run in CI instead of being skipped.
          pip install camel-tools docopt pyrsistent muddler emoji

      - name: Cache CAMeL Tools data
        # camel_tools' morphology DB (~40 MB) + dialect-ID model (~128 MB)
        # are downloaded out-of-band by `camel_data -i` and stored under
        # ~/.camel_tools. Cache that directory keyed on the installed
        # camel-tools version so we don't re-download ~170 MB on every run.
        uses: actions/cache@v4
        with:
          path: ~/.camel_tools
          key: ${{ runner.os }}-camel-tools-data-${{ hashFiles('engine/pyproject.toml') }}

      - name: Download CAMeL Tools morphology databases
        # Idempotent: camel_data skips components that are already installed,
        # so on a cache hit this is a no-op. We install only the two
        # components this project actually imports (MorphologyDB for the
        # Analyzer, DIDModel6 for dialect ID) — see nlp/arabic/pipeline.py.
        # The full `defaults` meta-package is ~2 GB and unnecessary here.
        run: |
          camel_data -i morphology-db-msa-r13
          camel_data -i dialectid-model6

      - name: Download spaCy model (en_core_web_sm)
        # Many engine tests (test_api, test_phase2, ...) require the small
        # English spaCy model. Without it they 500/400 in CI. This download
        # is ~12 MB and makes 19+ previously-skipped tests actually run.
        run: python -m spacy download en_core_web_sm || true

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest tests/ -v --tb=short
        # All 17 tests in test_phase3_arabic.py run unconditionally in CI
        # now that camel_tools + its morphology databases are installed.
        # The @_needs_camel skipif marker is still in place so that local
        # dev environments without camel_tools get a clean "skipped with
        # reason" signal instead of import-time failures.

  # -----------------------------------------------------------------------
  # Web: TypeScript typecheck + build
  # -----------------------------------------------------------------------
  web:
    name: Web (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (PWA)
        run: npm run build

      - name: Verify PWA artifacts
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js

  # -----------------------------------------------------------------------
  # Desktop: Rust check (only if system deps available)
  # -----------------------------------------------------------------------
  # NOTE on externalBin handling:
  #   tauri.conf.json declares `"externalBin": ["binaries/corpusmind-engine"]`
  #   so the release workflow can bundle the PyInstaller-built engine sidecar.
  #   At check time, `tauri-build` (invoked from build.rs) validates that every
  #   externalBin entry exists on disk with a target-triple suffix
  #   (e.g. `binaries/corpusmind-engine-x86_64-unknown-linux-gnu`). The CI
  #   runner does NOT build the sidecar — it only type-checks the Rust code —
  #   so we temporarily clear externalBin before `cargo check` and restore it
  #   afterwards. This mirrors the pattern in
  #   `scripts/build-corpusmind-mac.sh` (step 9), which does the same patch
  #   for local no-sidecar builds. The runtime code in `src/lib.rs`
  #   (resolve_command) already has a complete dev fallback chain when the
  #   sidecar binary is absent, so clearing externalBin here has no effect on
  #   the correctness of the type check.
  desktop:
    name: Desktop (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Temporarily clear externalBin + resources (no sidecar in CI)
        working-directory: desktop/src-tauri
        run: |
          cp tauri.conf.json tauri.conf.json.bak
          python3 - <<'PY'
          import json
          p = "tauri.conf.json"
          with open(p) as f:
              c = json.load(f)
          # Clear both externalBin AND resources — tauri-build validates both
          # at compile time (build.rs), and CI doesn't build the sidecar, so
          # both globs would fail. externalBin is checked for the target-triple
          # suffixed binary; resources is checked for the glob pattern.
          c["bundle"]["externalBin"] = []
          c["bundle"]["resources"] = []
          with open(p, "w") as f:
              json.dump(c, f, indent=2)
          print("externalBin + resources cleared for CI cargo check")
          PY

      - name: Cargo check
        run: cargo check --manifest-path Cargo.toml

      - name: Restore tauri.conf.json
        if: always()
        working-directory: desktop/src-tauri
        run: |
          if [ -f tauri.conf.json.bak ]; then
            mv tauri.conf.json.bak tauri.conf.json
            echo "tauri.conf.json restored"
          fi

  # -----------------------------------------------------------------------
  # Desktop Lens (Rust) — CorpusMind Lens build step 8
  # Same pattern as the desktop job above, but for the Lens Tauri shell.
  # -----------------------------------------------------------------------
  desktop-lens:
    name: Desktop Lens (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop-lens/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (lens)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop-lens/src-tauri/target
          key: ${{ runner.os }}-cargo-lens-${{ hashFiles('desktop-lens/src-tauri/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-lens-

      - name: Temporarily clear externalBin + resources (no sidecar in CI)
        working-directory: desktop-lens/src-tauri
        run: |
          cp tauri.conf.json tauri.conf.json.bak
          python3 - <<'PY'
          import json
          p = "tauri.conf.json"
          with open(p) as f:
              c = json.load(f)
          c["bundle"]["externalBin"] = []
          c["bundle"]["resources"] = []
          with open(p, "w") as f:
              json.dump(c, f, indent=2)
          print("externalBin + resources cleared for CI cargo check (lens)")
          PY

      - name: Cargo check (lens)
        run: cargo check --manifest-path Cargo.toml

      - name: Restore tauri.conf.json
        if: always()
        working-directory: desktop-lens/src-tauri
        run: |
          if [ -f tauri.conf.json.bak ]; then
            mv tauri.conf.json.bak tauri.conf.json
            echo "tauri.conf.json restored (lens)"
          fi

  # -----------------------------------------------------------------------
  # License gate
  # -----------------------------------------------------------------------
  license-gate:
    name: License gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify required files exist
        run: |
          test -f THIRD_PARTY_LICENSES.md
          test -f LICENSE

  # -----------------------------------------------------------------------
  # Issue 4 fix: validate the self-hosted Docker image actually builds AND
  # boots. The v1.0.0 image crash-looped at startup (reference_corpus missing
  # from the wheel) and its curl-based healthcheck could never pass — none of
  # which any CI job caught. This job gates both failure classes.
  # -----------------------------------------------------------------------
  docker-image:
    name: Docker image builds + engine boots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build engine image
        run: docker build -f infra/Dockerfile -t corpusmind-engine-ci .
      - name: Boot engine and probe /api/v1/health
        run: |
          docker run -d --name engine -p 8765:8765 corpusmind-engine-ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/v1/health >/dev/null 2>&1; then
              echo "engine is healthy"; exit 0
            fi
            sleep 2
          done
          echo "engine did not become healthy in time"
          docker logs engine
          exit 1
      - name: Verify container healthcheck passes
        run: |
          sleep 35
          docker inspect --format '{{.State.Health.Status}}' engine | grep -q healthy
