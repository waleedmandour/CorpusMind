<text x="65.0" y="61.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="14.0" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">1 · Researcher query</text>
<text x="65.0" y="81.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.8" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">Asked in natural language against the open</text>
<text x="65.0" y="98.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.8" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">project</text>
<text x="375.0" y="50.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="17.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(148, 163, 184)" dominant-baseline="central">▶</text>
<text x="450.0" y="61.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="14.0" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">2 · Planner selects tools</text>
<text x="450.0" y="81.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.8" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">Chooses among 27 registered corpus,</text>
<text x="450.0" y="98.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.8" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">statistics and vision tools; runs on local Ollama</text>
<text x="450.0" y="114.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.8" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">or cloud OpenAI / Anthropic</text>
<text x="760.0" y="50.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="17.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(148, 163, 184)" dominant-baseline="central">▶</text>
<text x="835.0" y="61.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="14.0" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">3 · Tool execution</text>
<text x="835.0" y="81.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.8" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">Deterministic engine calls — concordance,</text>
<text x="835.0" y="98.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.8" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">collocation, measures — never model</text>
<text x="835.0" y="114.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.8" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">guesswork</text>
<text x="65.0" y="249.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="14.0" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">6 · Answer with contract</text>
<text x="65.0" y="269.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.8" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">Delivered with the evidence attached; the same</text>
<text x="65.0" y="286.1" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.8" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">answer is written to the YAML provenance log.</text>
<text x="75.0" y="334.1" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(6, 95, 70)" dominant-baseline="central">cited to corpus</text>
<text x="75.0" y="349.6" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(6, 95, 70)" dominant-baseline="central">evidence</text>
<text x="75.0" y="317.6" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(6, 95, 70)" dominant-baseline="central">Grounded</text>
<text x="203.0" y="334.1" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(138, 59, 30)" dominant-baseline="central">flagged, never</text>
<text x="203.0" y="349.6" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(138, 59, 30)" dominant-baseline="central">asserted</text>
<text x="203.0" y="317.6" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(138, 59, 30)" dominant-baseline="central">Unsupported</text>
<text x="375.0" y="238.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="17.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(148, 163, 184)" dominant-baseline="central">◀</text>
<text x="450.0" y="249.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="14.0" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">5 · Grounding verification</text>
<text x="450.0" y="269.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.8" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">Every drafted claim is checked against</text>
<text x="450.0" y="286.1" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.8" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">retrieved evidence before it reaches the</text>
<text x="450.0" y="302.6" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.8" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">researcher</text>
<text x="760.0" y="238.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="17.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(148, 163, 184)" dominant-baseline="central">◀</text>
<text x="835.0" y="249.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="14.0" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">4 · Evidence candidates</text>
<text x="835.0" y="269.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.8" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">Concordance lines, collocation tables,</text>
<text x="835.0" y="286.1" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.8" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">dispersion scores, vision annotations</text>
<text x="588.0" y="177.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(230, 159, 0)" dominant-baseline="central">evidence insufficient → planner</text>
<text x="588.0" y="192.6" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(230, 159, 0)" dominant-baseline="central">re-queries</text>
<text x="574.0" y="402.1" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="11.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(156, 163, 175)" dominant-baseline="central">No answer is produced from memory alone: the contract is enforced before the researcher sees a single sentence.</text>
</svg>