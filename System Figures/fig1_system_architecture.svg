<text x="78.0" y="64.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="16.0" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Presentation layer</text>
<text x="78.0" y="83.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">One interface, two shells — identical analysis surface</text>
<text x="78.0" y="99.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.5" font-weight="600" font-style="normal" letter-spacing="1.60" fill="rgb(100, 116, 139)" dominant-baseline="central">TIER 1</text>
<text x="78.0" y="138.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="14.5" font-weight="600" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Tauri 2 desktop shell</text>
<text x="78.0" y="158.8" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">Windows · macOS (Intel &amp; Apple silicon) · Linux</text>
<text x="471.0" y="138.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="14.5" font-weight="600" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Web UI — React + TypeScript</text>
<text x="471.0" y="158.8" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">Vite single-page app served by the shell or hosted</text>
<text x="78.0" y="212.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="14.5" font-weight="600" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Network views — Sigma.js</text>
<text x="78.0" y="232.9" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">WebGL renderer with automatic 2D-canvas fallback</text>
<text x="471.0" y="212.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="14.5" font-weight="600" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Full RTL interface mirroring</text>
<text x="471.0" y="232.9" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">Arabic and Urdu right-to-left UI, Cairo/Segoe fonts</text>
<text x="288.6" y="298.1" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">JSON over localhost — the UI never touches Python directly</text>
<text x="443.0" y="317.1" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(148, 163, 184)" dominant-baseline="central">▼</text>
<text x="78.0" y="354.6" text-anchor="start" font-family="Arial, Liberation Sans" font-size="16.0" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Analysis engine</text>
<text x="78.0" y="373.1" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">Local-first: nothing leaves the researcher's machine</text>
<text x="78.0" y="389.1" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.5" font-weight="600" font-style="normal" letter-spacing="1.60" fill="rgb(100, 116, 139)" dominant-baseline="central">TIER 2</text>
<text x="78.0" y="428.1" text-anchor="start" font-family="Arial, Liberation Sans" font-size="14.5" font-weight="600" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">FastAPI application server</text>
<text x="78.0" y="448.9" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">REST API over localhost; ships as a packaged sidecar with the</text>
<text x="78.0" y="465.1" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">desktop app</text>
<text x="471.0" y="428.1" text-anchor="start" font-family="Arial, Liberation Sans" font-size="14.5" font-weight="600" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">SQLite project storage</text>
<text x="471.0" y="448.9" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">Corpora, documents, vector cache, saved queries, provenance</text>
<text x="78.0" y="518.3" text-anchor="start" font-family="Arial, Liberation Sans" font-size="14.5" font-weight="600" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Background job runner</text>
<text x="78.0" y="539.1" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">Chunked, cancellable bulk jobs with progress; one bulk job at a</text>
<text x="78.0" y="555.3" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">time</text>
<text x="471.0" y="518.3" text-anchor="start" font-family="Arial, Liberation Sans" font-size="14.5" font-weight="600" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Smart Troubleshooting</text>
<text x="471.0" y="539.1" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">Built-in diagnostics for models, resources and engine health</text>
<text x="284.9" y="620.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">in-process calls to model libraries — no subprocess per query</text>
<text x="443.0" y="639.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(148, 163, 184)" dominant-baseline="central">▼</text>
<text x="78.0" y="677.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="16.0" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">NLP &amp; AI layer</text>
<text x="78.0" y="695.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">Deterministic NLP first; language models only where they earn their place</text>
<text x="78.0" y="711.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.5" font-weight="600" font-style="normal" letter-spacing="1.60" fill="rgb(100, 116, 139)" dominant-baseline="central">TIER 3</text>
<text x="78.0" y="750.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="14.5" font-weight="600" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">spaCy pipelines × 5 languages</text>
<text x="78.0" y="771.3" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">English, Arabic, Urdu, Hindi, Persian — POS, dependency,</text>
<text x="78.0" y="787.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">sentences</text>
<text x="471.0" y="750.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="14.5" font-weight="600" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">CAMeL Tools (Arabic)</text>
<text x="471.0" y="771.3" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">Morphology: root, pattern, lemma, stem; dialect &amp; register</text>
<text x="471.0" y="787.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">identification</text>
<text x="78.0" y="840.7" text-anchor="start" font-family="Arial, Liberation Sans" font-size="14.5" font-weight="600" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Vector search — bge-m3</text>
<text x="78.0" y="861.6" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">Multilingual embeddings via Ollama; cached locally in SQLite</text>
<text x="471.0" y="840.7" text-anchor="start" font-family="Arial, Liberation Sans" font-size="14.5" font-weight="600" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Grounded AI agent</text>
<text x="471.0" y="861.6" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">27 registered tools; local Ollama or cloud OpenAI / Anthropic</text>
<text x="902.0" y="64.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="14.5" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Student Mode</text>
<text x="902.0" y="88.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">Optional classroom layer: the</text>
<text x="902.0" y="105.4" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">teacher's device acts as the</text>
<text x="902.0" y="122.8" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">classroom server.</text>
<text x="913.0" y="156.2" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Read-only classroom site over</text>
<text x="913.0" y="172.4" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">the local network, served by a</text>
<text x="913.0" y="188.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Caddy sidecar</text>
<text x="913.0" y="228.7" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Concurrent seats capped by</text>
<text x="913.0" y="244.9" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">device and LM resources</text>
<text x="913.0" y="285.1" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Anonymous audit log: every</text>
<text x="913.0" y="301.3" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">query + answer, no IPs, tokens</text>
<text x="913.0" y="317.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">or session IDs</text>
<text x="913.0" y="357.7" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Students join by URL or QR</text>
<text x="913.0" y="373.9" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">code; browser only</text>
<text x="582.0" y="927.8" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="11.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(156, 163, 175)" dominant-baseline="central">All processing is local; the only optional network calls are user-configured AI providers (Ollama, OpenAI, Anthropic).</text>
</svg>