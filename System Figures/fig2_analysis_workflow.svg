<text x="83.0" y="73.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="16.0" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(51, 65, 85)" dominant-baseline="central">1 · Corpus construction</text>
<text x="120.0" y="120.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="13.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Upload documents</text>
<text x="100.5" y="122.0" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="11.5" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(71, 85, 105)" dominant-baseline="central">1</text>
<text x="236.3" y="121.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">— TXT, PDF, DOCX and images; automatic language tagging per document</text>
<text x="120.0" y="167.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="13.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Clean and normalize</text>
<text x="100.5" y="169.0" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="11.5" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(71, 85, 105)" dominant-baseline="central">2</text>
<text x="247.6" y="168.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">— per-language normalizers; Arabic orthographic unification and diacritic handling</text>
<text x="120.0" y="214.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="13.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Visual ingestion</text>
<text x="100.5" y="216.0" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="11.5" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(71, 85, 105)" dominant-baseline="central">3</text>
<text x="218.1" y="215.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">— the companion Lens app turns image corpora into analyzable annotations</text>
<text x="484.0" y="271.0" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="20.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(148, 163, 184)" dominant-baseline="central">▼</text>
<text x="83.0" y="323.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="16.0" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(30, 58, 95)" dominant-baseline="central">2 · Quantitative analysis</text>
<text x="120.0" y="370.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="13.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Concordance</text>
<text x="100.5" y="372.0" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="11.5" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(30, 58, 95)" dominant-baseline="central">4</text>
<text x="204.1" y="371.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">— simple search or CQL query language; one-click Arabic normalization across tools</text>
<text x="120.0" y="417.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="13.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Frequency and associations</text>
<text x="100.5" y="419.0" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="11.5" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(30, 58, 95)" dominant-baseline="central">5</text>
<text x="291.9" y="418.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">— collocation (8 measures), keyness (6), dispersion (4), n-grams</text>
<text x="120.0" y="464.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="13.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Layers and profiles</text>
<text x="100.5" y="466.0" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="11.5" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(30, 58, 95)" dominant-baseline="central">6</text>
<text x="237.8" y="465.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">— POS, grammar, dependency parsing, vocabulary profiling, sentiment</text>
<text x="120.0" y="511.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="13.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Vector KWIC</text>
<text x="100.5" y="513.0" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="11.5" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(30, 58, 95)" dominant-baseline="central">7</text>
<text x="201.0" y="512.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">— semantic re-ranking of concordance lines with multilingual embeddings</text>
<text x="484.0" y="568.0" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="20.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(148, 163, 184)" dominant-baseline="central">▼</text>
<text x="83.0" y="620.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="16.0" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(30, 48, 80)" dominant-baseline="central">3 · Interpretation and grounding</text>
<text x="120.0" y="667.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="13.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Discourse lenses</text>
<text x="100.5" y="669.0" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="11.5" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(30, 48, 80)" dominant-baseline="central">8</text>
<text x="226.5" y="668.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">— 15 publication-grounded frameworks — 7 textual, 8 visual (Kress &amp; van Leeuwen)</text>
<text x="120.0" y="714.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="13.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Learner research</text>
<text x="100.5" y="716.0" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="11.5" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(30, 48, 80)" dominant-baseline="central">9</text>
<text x="226.6" y="715.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">— CAF report, CIA comparison, rule-based error-pattern candidates</text>
<text x="120.0" y="761.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="13.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">AI assistant</text>
<text x="100.5" y="763.0" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="11.5" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(30, 48, 80)" dominant-baseline="central">10</text>
<text x="193.5" y="762.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">— every claim backed by a cited concordance line or flagged as unsupported</text>
<text x="484.0" y="818.0" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="20.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(148, 163, 184)" dominant-baseline="central">▼</text>
<text x="83.0" y="870.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="16.0" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(23, 37, 64)" dominant-baseline="central">4 · Publication outputs</text>
<text x="120.0" y="917.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="13.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Export tables and plots</text>
<text x="100.5" y="919.0" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="11.5" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(23, 37, 64)" dominant-baseline="central">11</text>
<text x="261.1" y="918.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">— Excel, Word, PDF, LaTeX and plain text with journal-ready formatting</text>
<text x="120.0" y="964.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="13.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">methods.pdf</text>
<text x="100.5" y="966.0" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="11.5" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(23, 37, 64)" dominant-baseline="central">12</text>
<text x="198.0" y="965.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">— a draft methodology section generated from the actual analysis chain</text>
<text x="120.0" y="1011.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="13.5" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">YAML provenance</text>
<text x="100.5" y="1013.0" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="11.5" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(23, 37, 64)" dominant-baseline="central">13</text>
