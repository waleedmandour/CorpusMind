<text x="64.0" y="66.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="15.5" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Teacher device — desktop app</text>
<text x="64.0" y="85.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">the full CorpusMind installation, unchanged</text>
<text x="78.0" y="121.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="13.5" font-weight="600" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Analysis engine + teacher's corpora</text>
<text x="78.0" y="139.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.8" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">private project storage; nothing is copied to students</text>
<text x="78.0" y="184.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="13.5" font-weight="600" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Classroom server (Caddy sidecar)</text>
<text x="78.0" y="201.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.8" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">serves a read-only view of the analysis tools and AI assistant</text>
<text x="78.0" y="246.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="13.5" font-weight="600" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Local language model (Ollama)</text>
<text x="78.0" y="264.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.8" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">student queries answered on the teacher's hardware</text>
<text x="78.0" y="309.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="13.5" font-weight="600" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Anonymous audit log</text>
<text x="78.0" y="326.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.8" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">every student query + the model's answer — no IPs, tokens or</text>
<text x="78.0" y="343.1" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.8" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">session IDs</text>
<text x="604.0" y="131.7" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">one-time admission, capped seats</text>
<text x="604.0" y="112.0" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="13.0" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">URL / QR join →</text>
<text x="604.0" y="202.7" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">HTTP within the local network; no</text>
<text x="604.0" y="219.5" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">cloud relay</text>
<text x="604.0" y="183.0" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="13.0" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">↔ Classroom LAN only</text>
<text x="604.0" y="290.5" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">read-only results; nothing persists</text>
<text x="604.0" y="307.3" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">on devices</text>
<text x="604.0" y="270.8" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="13.0" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">← Queries + answers</text>
<text x="785.0" y="66.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="15.5" font-weight="700" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Student devices</text>
<text x="785.0" y="85.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="12.0" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">any phone or tablet browser — nothing installed</text>
<text x="799.0" y="121.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="13.5" font-weight="600" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Join by URL or QR code</text>
<text x="799.0" y="139.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.8" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">one tap; the seat cap decides admission</text>
<text x="799.0" y="184.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="13.5" font-weight="600" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Read-only analysis tools</text>
<text x="799.0" y="201.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.8" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">concordance, collocation, dispersion … on the teacher's</text>
<text x="799.0" y="218.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.8" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">corpora</text>
<text x="799.0" y="263.0" text-anchor="start" font-family="Arial, Liberation Sans" font-size="13.5" font-weight="600" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Grounded AI assistant</text>
<text x="799.0" y="280.5" text-anchor="start" font-family="Arial, Liberation Sans" font-size="11.8" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(100, 116, 139)" dominant-baseline="central">same citation contract as the desktop app</text>
<text x="604.0" y="419.6" text-anchor="middle" font-family="Arial, Liberation Sans" font-size="12.3" font-weight="400" font-style="normal" letter-spacing="0.00" fill="rgb(31, 41, 55)" dominant-baseline="central">Isolation by construction: students never see the teacher's files, settings or chat history; the audit log captures content only, stripped of identifying metadata.</text>
</svg>