<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- CorpusMind Lens — purpose-made mark (issue #9): aperture-eye.
       Eye (vision) + camera aperture (imaging) + corpus constellation
       (CorpusMind) on the Lens-blue badge. Source of record. -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e4eaf6"/>
    </linearGradient>
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#172554"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8b339"/>
      <stop offset="100%" style="stop-color:#d4a030"/>
    </linearGradient>
    <clipPath id="eyeClip">
      <path d="M 106 256 Q 256 106, 406 256 Q 256 406, 106 256 Z"/>
    </clipPath>
  </defs>

  <!-- Rounded square background (Lens blue) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Decorative circle (subtle) -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.05"/>

  <g fill="#000000">
    <path d="M 106 256 Q 256 106, 406 256 Q 256 406, 106 256 Z" transform="translate(256 261) scale(1.03) translate(-256 -256)" opacity="0.10"/>
    <path d="M 106 256 Q 256 106, 406 256 Q 256 406, 106 256 Z" transform="translate(256 264) scale(1.05) translate(-256 -256)" opacity="0.06"/>
    <path d="M 106 256 Q 256 106, 406 256 Q 256 406, 106 256 Z" transform="translate(256 267) scale(1.07) translate(-256 -256)" opacity="0.04"/>
  </g>

  <!-- Eye white -->
  <path d="M 106 256 Q 256 106, 406 256 Q 256 406, 106 256 Z" fill="url(#eyeGrad)"/>

  <!-- Iris: camera aperture, clipped by the eye -->
  <g clip-path="url(#eyeClip)">
    <circle cx="256" cy="256" r="74" fill="url(#irisGrad)"/>
    <!-- gold lens barrel ring -->
    <circle cx="256" cy="256" r="62" fill="none" stroke="url(#accentGrad)" stroke-width="13"/>
    <!-- aperture blades -->
    <g stroke="#c7d6f5" stroke-width="9" stroke-linecap="round" opacity="0.95">
      <line x1="300.0" y1="257.9" x2="279.6" y2="293.1"/>
      <line x1="276.3" y1="295.0" x2="235.7" y2="295.0"/>
      <line x1="232.4" y1="293.1" x2="212.0" y2="257.9"/>
      <line x1="212.0" y1="254.1" x2="232.4" y2="218.9"/>
      <line x1="235.7" y1="217.0" x2="276.3" y2="217.0"/>
      <line x1="279.6" y1="218.9" x2="300.0" y2="254.1"/>
    </g>
    <!-- corpus constellation pupil -->
    <g stroke="#ffffff" stroke-width="2.5" opacity="0.55">
        <line x1="256" y1="256" x2="232" y2="240"/>
        <line x1="256" y1="256" x2="280" y2="240"/>
        <line x1="256" y1="256" x2="232" y2="272"/>
        <line x1="256" y1="256" x2="280" y2="272"/>
    </g>
    <g>
        <circle cx="232" cy="240" r="6.5" fill="#ffffff"/>
        <circle cx="280" cy="240" r="6.5" fill="#ffffff"/>
        <circle cx="232" cy="272" r="6.5" fill="#ffffff"/>
        <circle cx="280" cy="272" r="6.5" fill="#ffffff"/>
    </g>
    <circle cx="256" cy="256" r="13" fill="url(#accentGrad)"/>
    <!-- light glints -->
    <circle cx="222" cy="222" r="9" fill="#ffffff" opacity="0.9"/>
    <circle cx="238" cy="210" r="4" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="498" width="512" height="14" fill="url(#accentGrad)" opacity="0.8"/>
</svg>
