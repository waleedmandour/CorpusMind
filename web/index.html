<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b6e4f" />
    <meta
      name="description"
      content="CorpusMind — local-first, AI-native research environment for corpus linguistics and multimodal discourse analysis."
    />
    <title>CorpusMind</title>
    <script>
      // v1.0.10: Lens shell loads this page as index.html?shell=lens. Swap the
      // favicon, theme color and document title before the app boots so the
      // Lens variant is visually distinct in the browser/dev server too.
      // (Tauri windows use the native icons; this only affects the web view.)
      (function () {
        try {
          if (new URLSearchParams(window.location.search).get("shell") !== "lens") return;
          var icon = document.querySelector('link[rel="icon"]');
          if (icon) icon.setAttribute("href", "/favicon-lens.svg");
          var theme = document.querySelector('meta[name="theme-color"]');
          if (theme) theme.setAttribute("content", "#2563eb");
          document.title = "CorpusMind Lens";
        } catch (e) { /* non-fatal branding tweak */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
