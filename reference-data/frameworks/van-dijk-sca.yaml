name: van-dijk-sca
full_name: "van Dijk (2008) Socio-Cognitive Approach"
version: "0.1.0"
framework_family: cda
description: "van Dijk's socio-cognitive approach places cognition between discourse and society: ideologies are shared social representations, and concrete text or talk is produced and understood through mental models and context models. Because discourse structures can only be related to social structures through these mediated cognitions, analysis examines how discourse expresses and reproduces socially shared beliefs - classically through the ideological square of positive self-presentation and negative other-presentation."
core_concepts:
  - "Socio-cognitive mediation: discourse - cognition - society"
  - "Mental models and context models"
  - "Ideologies as shared social representations"
  - "Ideological square: positive self / negative other presentation"
  - "Micro-macro level bridging"
references:
  - "van Dijk, T. A. (1998). Ideology: A Multidisciplinary Approach. Sage."
  - "van Dijk, T. A. (2001). Multidisciplinary CDA: A plea for diversity. In Wodak & Meyer (Eds.), Methods of Critical Discourse Analysis. Sage."
  - "van Dijk, T. A. (2008). Discourse and Context: A Sociocognitive Approach. Cambridge University Press."
categories:
  - id: mental_models
    label: Mental models
    description: "How the text constructs situation models in the reader's mind."
  - id: ideology
    label: Ideology
    description: "How the text reflects + reproduces group-based belief systems."
  - id: context
    label: Context models
    description: "How the text is shaped by the communicative situation."
output_schema:
  claim: str
  evidence_ids: [str]
  confidence: float
  framework: "van Dijk (2008) SCA"
guardrails:
  - "Claims about mental models are inferences, not observations."
  - "Us/them polarization claims must cite specific lexical choices."
