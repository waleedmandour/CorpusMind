name: peirce-semiotics
full_name: "Peirce (1867-1913) Semiotics"
version: "0.1.0"
framework_family: semiotics
description: "Peirce's triadic semiotics defines the sign through its relation to an object and an interpretant, with meaning produced in an unending process of interpretation (semiosis). His trichotomy of signs - icon (resemblance), index (causal or physical connection), symbol (convention) - offers a finer-grained typology than dyadic models and treats representation as inferential and fallibilist."
core_concepts:
  - "Triadic sign: representamen - object - interpretant"
  - "Semiosis: unlimited interpretive process"
  - "Icon, index, symbol"
  - "Abduction and fallibilism"
references:
  - "Peirce, C. S. (1931-1958). Collected Papers of Charles Sanders Peirce. Harvard University Press."
  - "Atkin, A. (2010). Peirce's Theory of Signs. Stanford Encyclopedia of Philosophy."
categories:
  - id: icon
    label: Icon (sign resembles object)
  - id: index
    label: Index (sign causally connected to object)
  - id: symbol
    label: Symbol (sign conventionally connected to object)
output_schema:
  claim: str
  evidence_ids: [str]
  confidence: float
  framework: "Peirce Semiotics"
  sign_type: str  # icon | index | symbol
guardrails:
  - "Sign-type classification must cite the specific resemblance/causality/convention."
